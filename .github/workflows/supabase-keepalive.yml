name: Supabase keepalive

on:
  schedule:
    # 03:17 Vietnam time every 3 days. Enough to keep light activity without spam.
    - cron: "17 20 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Supabase heartbeat
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/project_heartbeat?on_conflict=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"touched_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"source\":\"github-actions\"}"
